format: v1

source:
  metadata:
    desc: f"Armbian {upstream_version} image"
    vendor:
      name: Armbian
      eula:

armbian-visionfive2-minimal:
  metadata:
    desc: f"Armbian {upstream_version} image for StarFive VisionFive 2 (minimal)"
  version: "0.0.0"
  distfiles:
    - name: disk(regex(f"^Armbian_community_{upstream_version}_Visionfive2_[\\w]+_vendor_6\\.[\\w.-]+_minimal\\.img\\.xz$"))

armbian-visionfive2-xfce:
  metadata:
    desc: f"Armbian {upstream_version} image for StarFive VisionFive 2 (xfce desktop)"
  version: "0.0.0"
  distfiles:
    - name: disk(regex(f"^Armbian_community_{upstream_version}_Visionfive2_[\\w]+_vendor_6\\.[\\w.-]+_xfce_desktop\\.img\\.xz$"))
