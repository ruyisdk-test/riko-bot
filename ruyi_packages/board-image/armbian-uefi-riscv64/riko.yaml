format: v1

source:
  metadata:
    desc: f"Armbian {upstream_version} image"
    vendor:
      name: Armbian
      eula:

armbian-uefi-riscv64:
  metadata:
    desc: f"Armbian {upstream_version} image for UEFI RISC-V64"
  version: version(major=upstream_version.split('.')[0], minor=upstream_version.split('.')[1], patch=upstream_version.split('.')[2])
  distfiles:
    - name: disk(regex(f"^Armbian_{upstream_version}_Uefi-riscv64_[\\w]+_[\\w]+_[\\w.-]+\\.img\\.xz$"))
