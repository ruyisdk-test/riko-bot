format: v1

source:
  metadata:
    vendor:
      name: SpacemiT
      eula:
  version: version(major=(_v := upstream_version[1:].split("."))[0], minor=_v[1], patch=_v[2] if len(_v) > 2 else 0)

bianbu-minimal-spacemit-k1:
  metadata:
    desc: f"Official Bianbu Minimal {upstream_version} for SpacemiT K1"
  distfiles:
    - name: titan(regex(f"^Bianbu-Minimal-K1-V.+.zip$"))

bianbu-desktop-spacemit-k1:
  metadata:
    desc: f"Official Bianbu Desktop {upstream_version} for SpacemiT K1"
  distfiles:
    - name: titan(regex(f"^Bianbu-GNOME-K1-V.+.zip$"))

bianbu-desktop-lite-spacemit-k1:
  metadata:
    desc: f"Official Bianbu Desktop Lite {upstream_version} for SpacemiT K1"
  distfiles:
    - name: titan(regex(f"^Bianbu-LXQt-K1-V[^UEFI]+.zip$"))

bianbu-desktop-lite-uefi-spacemit-k1:
  metadata:
    desc: f"Official Bianbu Desktop Lite {upstream_version} for SpacemiT K1"
  distfiles:
    - name: titan(regex(f"^Bianbu-LXQt-K1-V.+-UEFI-.+.zip$"))

bianbu-minimal-spacemit-k1-sd:
  metadata:
    desc: f"Official Bianbu Minimal {upstream_version} for SpacemiT K1"
  distfiles:
    - name: disk(regex(f"^Bianbu-Minimal-K1-sdcard-V.+.zip$"))

bianbu-desktop-spacemit-k1-sd:
  metadata:
    desc: f"Official Bianbu Desktop {upstream_version} for SpacemiT K1"
  distfiles:
    - name: disk(regex(f"^Bianbu-GNOME-K1-sdcard-V.+.zip$"))

bianbu-desktop-lite-spacemit-k1-sd:
  metadata:
    desc: f"Official Bianbu Desktop Lite {upstream_version} for SpacemiT K1"
  distfiles:
    - name: disk(regex(f"^Bianbu-LXQt-K1-sdcard-V[^UEFI]+.zip$"))

bianbu-desktop-lite-uefi-spacemit-k1-sd:
  metadata:
    desc: f"Official Bianbu Desktop Lite {upstream_version} for SpacemiT K1"
  distfiles:
    - name: disk(regex(f"^Bianbu-LXQt-K1-sdcard-V.+-UEFI-.+.zip$"))
