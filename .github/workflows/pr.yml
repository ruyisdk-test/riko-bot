name: PR checks

on:
  pull_request:
    branches:
      - checker

jobs:
  dco:
    name: DCO compliance
    runs-on: ubuntu-latest # Run the workflow on the latest Ubuntu
    steps: # Actions to run
      - name: Run dco-check
        uses: christophebedard/dco-check@0.5.0 # A ready-made action for DCO compliance checks
        with:
          python-version: '3.12'
          args: '--verbose'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
